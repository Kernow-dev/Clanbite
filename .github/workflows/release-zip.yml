name: Build release zip

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    plugin-zip:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  tools: composer:v2
                  coverage: none

            # Production vendor/ only (matches WordPress.org and local `plugin-zip` expectations).
            - name: Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build production assets and zip
              run: npm run plugin-zip

            - name: Upload zip to release
              uses: softprops/action-gh-release@v2
              with:
                  files: clanbite.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # WordPress.org: only full releases. Drafts never fire `published`; pre-releases are skipped here.
            # Deploys the exact files that ship in the zip (the zip holds a top-level `clanbite/` folder), so
            # SVN trunk and the tag match the GitHub release. Needs SVN_USERNAME / SVN_PASSWORD repository secrets.
            - name: Unpack release zip for WordPress.org
              if: ${{ ! github.event.release.prerelease }}
              run: unzip -q clanbite.zip -d wporg-build

            - name: Deploy to WordPress.org
              if: ${{ ! github.event.release.prerelease }}
              uses: 10up/action-wordpress-plugin-deploy@stable
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: clanbite
                  BUILD_DIR: wporg-build/clanbite
                  # Set to true to preview what would be committed without touching the directory.
                  DRY_RUN: false

name: Docs

# Keeps developer.clanbite.com in step with this plugin. Pull requests and pushes are checked; publishing a release imports that
# version into the site (see https://github.com/Kernow-dev/clanbite-docs for the setup and the secrets this needs).

on:
  pull_request:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, for example v1.2.3
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: Kernow-dev/clanbite-docs/.github/workflows/check.yml@main
    with:
      plugin-slug: clanbite
    secrets: inherit

  publish:
    # Pre-releases are not documented: the site shows what site owners can install.
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.event_name == 'workflow_dispatch'
    uses: Kernow-dev/clanbite-docs/.github/workflows/publish.yml@main
    permissions:
      contents: write
    with:
      plugin-slug: clanbite
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
    secrets: inherit

name: Plugin Check

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  plugin-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plugin Check scans the same zip the release workflow publishes (`npm run plugin-zip`, which ships only the
      # `files` list in package.json), so repository-only files such as dotfiles never reach the scan.

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Composer install (autoload only, no dev tools)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies and build the release zip
        run: |
          npm ci
          npm run plugin-zip

      - name: Unpack the release zip for Plugin Check
        run: unzip -q clanbite.zip -d plugin-check-staging

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin-check-staging/clanbite
          slug: clanbite
          exclude-directories: |
            node_modules
